<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Ehsan Salimi</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="hero" style="min-height: 100vh; display: grid; align-items: center">
      <div class="container">
        <p class="eyebrow">404</p>
        <h1 class="hero__title">Page not found</h1>
        <p class="hero__tagline">That link doesn't go anywhere. The rest of the site is one click away.</p>
        <div class="hero__actions">
          <a class="btn btn--primary" href="/">Go to the home page</a>
          <a class="btn btn--ghost" href="/#projects">See projects</a>
        </div>
      </div>
    </main>
  </body>
</html>
